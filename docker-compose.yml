version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: campusos_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: campusos_admin
      POSTGRES_PASSWORD: campusos_secure_pass_2026
      POSTGRES_DB: campusos_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos_admin -d campusos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: campusos_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
