services:
  - type: web
    name: campusos-ai-backend
    env: python
    buildCommand: cd backend && pip install --prefer-binary --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: API_V1_STR
        value: /api/v1
      - key: DEBUG
        value: "false"
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://campus-os-ai-jbth.vercel.app,http://localhost:5173,http://localhost:3000,*"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
