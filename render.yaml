services:
  - type: web
    name: campusos-ai-backend
    env: python
    buildCommand: cd backend && pip install --no-cache-dir --prefer-binary -r requirements.txt

    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_V1_STR
        value: /api/v1
      - key: DEBUG
        value: "false"
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
