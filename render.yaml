services:
  - type: web
    name: campusos-ai-backend
    env: python
    buildCommand: pip install --prefer-binary --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: backend:.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: API_V1_STR
        value: /api/v1
      - key: DEBUG
        value: "false"
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://campus-os-ai-jbth.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false


